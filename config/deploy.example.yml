# A customer destination: copy to config/deploy.<customer>.yml, fill it in, then
#   kamal deploy -d <customer>
# Only what differs per customer lives here; config/deploy.yml holds the rest.

servers:
  web:
    hosts:
      - <%= h = ENV["KAMAL_HOST"].to_s.strip; h.empty? ? raise("KAMAL_HOST unset — export it or put it in .kamal/secrets") : h %>

proxy:
  hosts:
    - app.example.com # the customer's domain (an A record pointing at the host)
  # HTTPS: one line, once DNS points here — kamal-proxy gets a Let's Encrypt certificate.
  # ssl: true

# A new server usually takes SSH on 22 with your own key (the base assumes root on 2228).
# ssh:
#   user: root
#   port: 22
#   keys: ["~/.ssh/id_ed25519"]

env:
  clear:
    VOIPAPPZ_API_URL: https://api.example.com # this customer's voipappz-api
