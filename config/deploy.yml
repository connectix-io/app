# Kamal: one container (the React build served by the Hono server), modelled on the
# mother app's config (~/voipappz/app/config/deploy.yml). Kamal does the whole deploy:
# build, push, boot, health check, zero-downtime swap, rollback.
#
#   kamal setup   -d <customer>   first time on a host
#   kamal deploy  -d <customer>   every release
#   kamal rollback <version> -d <customer>
#
# Every command needs a destination (config/deploy.<customer>.yml: host, domain, API
# url). Start a new one from config/deploy.example.yml. Secrets come from
# .kamal/secrets (gitignored), never from this file.

service: voipappz-app
image: nirlevi/voipappz-app

# A bare `kamal deploy` (no -d) is refused, so nothing reaches a host by accident.
require_destination: true

servers:
  web:
    hosts:
      - dest-required.invalid # replaced by the destination's hosts

builder:
  arch: amd64
  dockerfile: Dockerfile.production
  # Layer cache in the registry: repeat builds from any machine are fast.
  cache:
    type: registry
    options: mode=max
  args:
    # Public by design: baked into the browser bundle.
    VITE_APP_VERSION: <%= "#{Time.now.strftime('%Y.%m.%d')}-#{`git rev-parse --short HEAD`.strip}" %>
    VITE_SUPABASE_URL: <%= ENV["VITE_SUPABASE_URL"] %>
    VITE_SUPABASE_ANON_KEY: <%= ENV["VITE_SUPABASE_ANON_KEY"] %>

proxy:
  app_port: 3000
  healthcheck:
    path: /health
    interval: 3
    timeout: 5

# Keeps the previous release's hashed JS/CSS next to the new ones during a swap, so a
# browser still holding the old page never fetches a missing asset.
asset_path: /app/dist/assets

env:
  clear:
    NODE_ENV: production
    PORT: 3000

# Boot wait for the new container to become healthy, and old releases kept for rollback.
deploy_timeout: 60
retain_containers: 5

registry:
  username: nirlevi
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: root
  port: 2228
  keys: ["~/.ssh/kamal_deploy"]

# Short names: `kamal logs -d <customer>`, `kamal shell -d <customer>`.
aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
