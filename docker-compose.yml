# Development stack. The core service (`app`) has no profile, so a plain
#   docker compose up -d        (or: make up)
# starts only it. Optional services sit behind a profile:
#   docker compose --profile tools up -d claude
#   docker compose --profile prod  up --build production
services:
  # The app in development: the Hono server (:3000) and Vite with HMR (:4200),
  # Vite passing /api and /auth to Hono, which passes them to voipappz-api.
  app:
    image: node:24.10.0
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
    ports:
      - "4200:4200"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    command: bash -c "npm install && npm run dev:all -- --host 0.0.0.0"

  # The production image, locally (same Dockerfile Kamal builds). Opt-in: --profile prod
  production:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile.production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production

  # Claude Code CLI (dev shell). Opt-in: --profile tools
  claude:
    profiles: ["tools"]
    build: .
    env_file:
      - .env
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_cache:/app/node_modules
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      NODE_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY} # each dev sets their own key
    command: sleep infinity

volumes:
  node_modules_cache:
